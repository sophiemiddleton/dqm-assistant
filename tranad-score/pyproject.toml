[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tranad-score"
version = "0.1.0"
description = "Score one run's DQM points with a trained mu2e_tranad (TranAD) model; emits dqm-method-scores/1"
requires-python = ">=3.10"
# mu2e_tranad (TranAD pipeline, including the TranAD model) and mu2e-dqm come from git:
# see ../install.sh.
dependencies = [
    "mu2e-tranad",
    "mu2e-dqm",
    "torch>=2.0",
]

[project.scripts]
tranad-score = "tranad_score.__main__:main"

[tool.setuptools]
packages = ["tranad_score"]
