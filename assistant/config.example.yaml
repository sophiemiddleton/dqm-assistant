# dqm-assistant configuration. Copy to config.yaml and adjust paths.
store: ./var/store            # findings + reports per run (JSON)
cache: ./var/cache            # summed run histograms
references: ./references.yaml
history_runs: 10              # recent runs used for persistent / reference_artefact
llm: true                     # LiteLLM gateway; key from LITELLM_API_KEY or ~/.litellm_key

subsystems:
  CRV:
    sid: 118                  # crvreco kpp_crv file 006-001 (has dqm.files rows)
    source_version: "006-001"
    dataset_dir: /pnfs/mu2e/persistent/datasets/phy-ntd/dqm/mu2e/cosmics_crv/crvreco-006-001-file
    default_run_type: cosmics # until the runs MCP is wired in
    # periods: /abs/periods_006-001.csv     # e.g. from mu2e-tranad configs/   # period,start_run,end_run
    items:                    # histogram paths inside the DQM files
      - crvRecoDQM/PEr
      - crvRecoDQM/logchi2
      - crvDigiDQM/crvDigisPerChannel
      - crvDigiDQM/h1_peakAdc
      - crvStatusDQM/errorBits
      - crvStatusDQM/activeFebCount
    mean: []                  # items averaged over subruns instead of summed
    detectors:                # the method-agnostic part: any list of plugins
      - {type: ks}
      # TranAD: run the tranad model directly (needs install.sh --tranad), or read its alarms
      # once tranad commits them. Train with: python -m mu2e_tranad --csv <matrix> --save-model <pkl>
      - {type: tranad, model: /path/to/crv_tranad_006-001.pkl, detectors: [tranad, drift]}
      # ...or the scorer from another venv, so this one needs no torch (~20 s/run: reloads model):
      # - type: tranad
      #   command: [/abs/other-venv/bin/tranad-score, --model, /abs/m.pkl, --sid, "{sid}", "{run}"]
      # Any other method emitting dqm-method-scores/1 (../method-scores/SCHEMA.md):
      # - {type: remote, method: my_method, url: http://localhost:8020/score,
      #    card: {compares: "...", granularity: metric, needs_reference: false}}
      # - {type: dqm_alarms, algo: tranad, card: tranad}
      - {type: dqm_alarms, algo: limits, card: limits}
      # Histogram methods from mu2e-histcompare, on the same items as ks, so they can confirm or
      # overrule it. hydra: per-histogram CNN, no reference (install.sh --hydra); models from
      # mu2e-hydra (python -m hydra_mu2e.realdata run ...), items without a model are UNSURE.
      # - {type: hydra, models: /abs/models/hydra-006-001-C, threshold: 0.5}
      # vision: one LLM call per histogram (LITELLM_API_KEY); instructions are a name bundled
      # with mu2e-histcompare (crv_real_draft) or a path to a YAML. on_demand: not run by
      # assess_run, only by compare(run, item, method="vision") -- any detector can take it.
      # - {type: vision, instructions: crv_real_draft, model: azure/claude-opus-5-5, on_demand: true}
      # ks options: {type: ks, tight: 0.05, loose: 0.01}  (mu2e-histcompare's defaults)
